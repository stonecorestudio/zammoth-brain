[pytest]
# The engine + orchestrator suite: `cd server && pytest`. (backend/ has its own tests and is run
# from the repo root.) The markers are registered in tests/conftest.py.

# Every test is under tests/: without this a bare `pytest` walks mix_engine/ and scripts/ too.
testpaths = tests

# Where hypothesis is installed, its pytest plug-in loads itself in every pytest process - 0.3 s
# of imports before the first test, in each run and in each parallel worker - and writes
# server/.hypothesis. No test here uses hypothesis. (Naming a plug-in that is not installed
# is not an error.)
addopts = -p no:hypothesispytest

# A passing test's tmp_path goes when the test ends; a failing test's is kept for the
# post-mortem. The default keeps every test's folder for the last three runs: the suite copies
# stems into four thousand of them, and that was 2.7 GB under $TMPDIR/pytest-of-<user>.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1

# The whole suite in parallel (pytest-xdist; `auto` is sized in tests/conftest.py):
#     pytest -n auto
# Not in addopts: a per-change run is a handful of tests, and starting workers for those costs
# more than it saves.
